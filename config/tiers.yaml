# Reglas de tiers de tracking (lógica en pipeline/tiers.py).
#
#   hot   → se consulta en cada corrida (Roblox: cada hora)
#   warm  → diario
#   cold  → semanal (para detectar si "despierta")
#
# Cada corrida recalcula el tier de todos los juegos con la historia reciente (snapshots +
# chart_positions de los últimos `window_days`) y registra los cambios en `tier_history`.
# Los juegos que aparecen en charts se consultan siempre, sea cual sea su tier.

roblox:
  window_days: 11          # historia que se lee para decidir (> 1,5 semanas para detectar cold atrasados)
  hold_hours: 48           # sigue hot si tuvo alguna señal hot en este lapso (histéresis)

  hot:                     # basta con cumplir UNA señal dentro de hold_hours
    chart: true            # apareció en algún chart de explore
    min_ccu: 1000          # playing >= 1000
    growth_min_ccu: 100    # crecimiento fuerte: playing >= 100 ...
    growth_ratio: 1.5      # ... y >= 1,5× el valor observado ~24 h antes
    growth_min_lag_hours: 20
    growth_max_lag_hours: 36
    new_max_age_days: 14   # nuevo con señales: creado hace <= 14 días ...
    new_min_ccu: 20        # ... y con playing >= 20

  warm:                    # si no es hot; basta con UNA señal dentro de window_days
    min_ccu: 20            # pico de playing >= 20
    chart_days: 7          # o apareció en un chart en los últimos 7 días

  # Todo lo demás es cold, incluidos los juegos sin ninguna observación en la ventana
  # (privados/borrados): se reintentan una vez por semana.

  cadence:                 # qué juegos entran en cada corrida horaria
    warm_slots: 24         # warm: 1 de cada 24 corridas (por hash del id → carga pareja)
    cold_slots: 168        # cold: 1 de cada 168 corridas (semanal)
    overdue_factor: 1.5    # si pasó 1,5× su período sin observarse (corridas salteadas), entra igual
    max_overdue_per_run: 2000

fortnite:
  # Historia que se lee para decidir: cada consulta trae los últimos 7 días, así que con la
  # última consulta de cada isla alcanza; 10 días cubre a las cold (cada 7) con margen.
  window_days: 10

  hot:                     # se consulta todos los días; basta con UNA señal
    min_peak_ccu: 50       # peak CCU diario >= 50 en los últimos 7 días
    growth_min_peak: 20    # crecimiento: peak de los últimos 2 días >= 20 ...
    growth_ratio: 2.0      # ... y >= 2× el de los 4 días anteriores (o sin datos antes)
    new_days: 3            # isla nueva en el catálogo: diaria durante sus primeros 3 días

  # warm: con algún dato en la ventana (>= 5 jugadores únicos algún día), o todavía sin
  # consultar. cold: consultada y sin datos (~80 % del catálogo).

  cadence:
    warm_days: 5           # cada 5 días (la API guarda 7 → 2 días de solapamiento)
    cold_days: 7           # cada 7 días (justo la ventana de la API, sin solapamiento)
    overdue_slack_days: 1  # si pasó cadencia + 1 día sin consulta (corrida salteada), entra
    max_overdue_per_run: 20000
