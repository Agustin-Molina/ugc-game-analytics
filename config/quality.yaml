# Checks de calidad de datos (pipeline/quality.py). Cada check da ok / warn / error;
# con algún error la corrida termina con exit code 1 → el workflow falla y GitHub avisa por mail.
#
# Umbrales "warn"/"error": el check se dispara si el valor los SUPERA (>).

lookback_days: 2              # ventana de los checks de valores (duplicados, imposibles, nulls)

roblox:
  run_gap_minutes: 15         # snapshots a más de 15 min de distancia = corridas distintas
  # Hueco máximo entre corridas horarias en las últimas 24 h (incluye "ahora − última").
  max_gap_hours: {warn: 2, error: 6}
  # Juegos atrasados respecto de su cadencia (hot 1 h, warm 24 h, cold 168 h) × factor.
  cadence_hours: {hot: 1, warm: 24, cold: 168}
  overdue_factor: 3           # hot: 3 h; warm: 72 h; cold: 21 días
  overdue_share: {warn: 0.05, error: 0.25}
  visits_decrease_share: {warn: 0.001, error: 0.05}
  null_share: {warn: 0.01, error: 0.10}
  # La API devuelve favoritedCount negativo en algunos juegos: se guarda tal cual y se avisa.
  negative_favorites_share: {warn: 0, error: 0.01}
  # Barrido diario de búsqueda: horas desde el último.
  search_age_hours: {warn: 30, error: 54}

fortnite:
  run_gap_minutes: 60
  # Horas desde la última corrida diaria. La API guarda 7 días y cada isla se consulta cada 5:
  # con 2 días salteados se empieza a perder data.
  last_run_age_hours: {warn: 26, error: 50}
  # Islas listadas del grupo de la última corrida que no se consultaron.
  group_missing_share: {warn: 0.02, error: 0.20}
  fetch_error_share: {warn: 0.02, error: 0.20}
  # Islas listadas (vistas hace > 6 días) sin consulta `day` en los últimos 6 días: se
  # está perdiendo su historia. Necesita 6 días de historia para evaluarse.
  coverage_days: 6
  uncovered_share: {warn: 0.005, error: 0.02}
