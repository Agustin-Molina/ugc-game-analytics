name: tests

# Tests (pytest, sin red: las APIs se mockean con respx) y lint en cada push y pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Dependencias
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check

      - name: Tests
        run: uv run pytest -q
