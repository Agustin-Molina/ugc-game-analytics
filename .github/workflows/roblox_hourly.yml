name: roblox_hourly

# El cron de GitHub saltea muchas corridas (el 2026-11-10 disparó 2 de 16), así que cada run
# es un loop (scripts/hourly_loop.sh): corre el colector todas las horas a las :17 durante
# ~5,5 h, commiteando después de cada corrida, y al final se relanza solo con
# workflow_dispatch (el GITHUB_TOKEN puede disparar workflow_dispatch). El cron queda como
# respaldo para retomar la cadena si se corta; si la cadena está corriendo, el run del cron
# queda en espera y lo reemplaza el siguiente eslabón (la concurrencia evita solapamientos).
#
# Además, después de cada corrida lanza los workflows diarios (Fortnite, búsqueda, calidad)
# si su cron no disparó (scripts/dispatch_missed.sh).
#
# Para cortar la cadena: cancelar el run en curso (el encadenado no corre si se cancela) y
# desactivar el workflow si el cron no debe retomarla.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Máximo de juegos a consultar (vacío = todos). Implica una sola corrida."
        required: false
        default: ""
      once:
        description: "Una sola corrida, sin loop ni encadenado (pruebas)"
        type: boolean
        default: false
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read
  actions: write   # para relanzarse con workflow_dispatch

concurrency:
  group: roblox_hourly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      UGC_DATA_DIR: data
      LOOP: ${{ !inputs.once && (inputs.limit || '') == '' }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Checkout repo de datos
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/ugc-game-analytics-data
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}
          path: data
          fetch-depth: 1

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Dependencias
        run: uv sync --frozen --no-dev

      - name: Colectar Roblox (una vez)
        if: env.LOOP != 'true'
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          args=()
          if [ -n "${LIMIT}" ]; then args+=(--limit "${LIMIT}"); fi
          uv run --no-dev python -m collectors.roblox "${args[@]}"

      - name: Commit y push de datos (una vez)
        if: always() && env.LOOP != 'true'
        run: bash scripts/commit_data.sh data roblox

      - name: Colectar Roblox cada hora a las :17 (loop de ~5,5 h)
        if: env.LOOP == 'true'
        env:
          GH_TOKEN: ${{ github.token }}  # para lanzar los diarios que el cron salteó
        run: bash scripts/hourly_loop.sh data 17 335

      - name: Encadenar el siguiente run
        if: ${{ !cancelled() && env.LOOP == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run roblox_hourly.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}"
