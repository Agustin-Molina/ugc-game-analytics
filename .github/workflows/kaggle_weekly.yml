name: kaggle_weekly

# Publica el dataset en Kaggle (pipeline/export.py → config/kaggle.yaml): un Parquet por
# tabla, con las features calculadas y el esquema documentado. Una versión nueva por semana.
#
# Secrets (los carga el dueño del repo; nunca en el código):
#   KAGGLE_USERNAME   usuario de Kaggle (el dataset queda en <usuario>/<slug>)
#   KAGGLE_API_TOKEN  token de kaggle.com/settings → API → Generate New Token
on:
  workflow_dispatch:
    inputs:
      create:
        description: "Primera publicación: crea el dataset (privado; se hace público en la web)"
        type: boolean
        default: false
      metadata_only:
        description: "Solo actualizar la ficha (textos, columnas, portada, visibilidad), sin versión nueva"
        type: boolean
        default: false
  # Activado el 2026-11-12 tras revisar la primera publicación. Lunes 04:29 UTC. Si el cron
  # no dispara, lo lanza el loop horario de Roblox (scripts/dispatch_missed.sh).
  schedule:
    - cron: "29 4 * * 1"

permissions:
  contents: read

concurrency:
  group: kaggle_weekly
  cancel-in-progress: false

jobs:
  # Si el cron llega tarde y hoy ya corrió (lo lanzó dispatch_missed.sh), no repetir.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ran_today.sh

  publish:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Verificar secrets
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "${KAGGLE_USERNAME}" ] || [ -z "${KAGGLE_API_TOKEN}" ]; then
            echo "::error::faltan los secrets KAGGLE_USERNAME y/o KAGGLE_API_TOKEN"
            exit 1
          fi

      - name: Checkout código
        uses: actions/checkout@v5

      - name: Checkout repo de datos
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/ugc-game-analytics-data
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}
          path: data
          fetch-depth: 1

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Dependencias
        run: uv sync --frozen --no-dev

      - name: Exportar
        env:
          UGC_DATA_DIR: data
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: uv run --no-dev python -m pipeline.export --out export --owner "${KAGGLE_USERNAME}"

      - name: Publicar en Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          CREATE: ${{ inputs.create }}
          METADATA_ONLY: ${{ inputs.metadata_only }}
        run: |
          # kaggle 2.2.5 no declara su dependencia de six
          kaggle() { uvx --from kaggle==2.2.5 --with six==1.17.0 kaggle "$@"; }
          if [ "${METADATA_ONLY}" = "true" ]; then
            echo "solo ficha: sin versión nueva"
          elif [ "${CREATE}" = "true" ]; then
            kaggle datasets create -p export -r skip -t
          else
            kaggle datasets version -p export -r skip -t -m "Weekly update $(date -u +%F)"
          fi
          # create/version no aplican frecuencia, fuentes, descripciones de archivos/columnas
          # ni portada: van por metadata --update. La ficha sale de config/kaggle.yaml (incluida
          # la visibilidad, `private`): lo que se edite a mano en la web se pisa acá.
          dataset_id="$(jq -r .id export/dataset-metadata.json)"
          # El endpoint de update no acepta el nombre de licencia de `create` ("invalid
          # license"): se reusa la licencia tal como la guarda Kaggle.
          mkdir -p current
          if kaggle datasets metadata "${dataset_id}" -p current; then
            lic="$(jq -c '(.info // .).licenses' current/dataset-metadata.json)"
            echo "licencia en Kaggle: ${lic}"
            jq --argjson lic "${lic}" '.licenses = $lic' export/dataset-metadata.json \
              > current/merged.json && mv current/merged.json export/dataset-metadata.json
          fi
          kaggle datasets metadata --update -p export "${dataset_id}" \
            || echo "::warning::no se pudo actualizar la metadata (la versión sí se publicó)"
          # Verificación: cuántas columnas quedaron con descripción en Kaggle.
          mkdir -p after
          if kaggle datasets metadata "${dataset_id}" -p after; then
            jq -c '(.info // .).data[0] | {name, description, columns: (.columns // [])[:3]}' \
              after/dataset-metadata.json || true
            described="$(jq '[(.info // .).data[]?.columns[]? | select((.description // "") != "")]
              | length' after/dataset-metadata.json || echo '?')"
            total="$(jq '[(.info // .).data[]?.columns[]?] | length' after/dataset-metadata.json || echo '?')"
            echo "columnas con descripción en Kaggle: ${described}/${total}"
          fi
          {
            echo "## Kaggle"
            echo ""
            echo "- archivos: $(ls export/*.parquet | wc -l) · $(du -sh export | cut -f1)"
            echo "- modo: $([ "${METADATA_ONLY}" = "true" ] && echo 'solo ficha' || { [ "${CREATE}" = "true" ] && echo 'creación (privado)' || echo 'versión nueva'; })"
            echo "- privado: $(jq -r .isPrivate export/dataset-metadata.json)"
            echo "- columnas con descripción: ${described:-?}/${total:-?}"
          } >> "${GITHUB_STEP_SUMMARY}"
